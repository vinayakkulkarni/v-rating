name: 'Doctor'

on:
  workflow_call:
    secrets:
      DOCTOR_API_KEY:
        description: 'API key for pushing scores to app.the-doctor.report'
        required: false

# pull-requests: write lets the action post its findings comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    name: 'Vue Doctor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'

      # The dead-code pass loads vite.config.ts and demo/nuxt.config.ts; their
      # plugins must be installed or every dependency reads as unused.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit with vue-doctor
        uses: geoql/doctor-action@v2
        with:
          framework: vue
          preset: recommended
          threshold: ${{ vars.DOCTOR_THRESHOLD || '70' }}
          fail-on: error
          api-key: ${{ secrets.DOCTOR_API_KEY }}
          project: ${{ github.repository }}
          pr-comment: true
          comment-mode: both
